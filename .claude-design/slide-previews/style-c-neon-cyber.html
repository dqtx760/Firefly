<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gsearch-cli - Neon Cyber Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ===========================================
           VIEWPORT FITTING: MANDATORY BASE STYLES
           =========================================== */
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .slide-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-height: 100%;
            overflow: hidden;
            padding: var(--slide-padding);
        }
        :root {
            --title-size: clamp(1.5rem, 5vw, 4rem);
            --h2-size: clamp(1.25rem, 3.5vw, 2.5rem);
            --body-size: clamp(0.75rem, 1.5vw, 1.125rem);
            --slide-padding: clamp(1rem, 4vw, 4rem);
            --content-gap: clamp(0.5rem, 2vw, 2rem);
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.2s !important;
            }
            html { scroll-behavior: auto; }
        }

        /* ===========================================
           NEON CYBER THEME
           Futuristic, techy, confident
           =========================================== */
        :root {
            --bg-primary: #0a0f1c;
            --bg-dark: #050810;
            --accent-cyan: #00ffcc;
            --accent-magenta: #ff00aa;
            --text-primary: #ffffff;
            --text-secondary: #6b7a99;
            --font-display: 'Syne', sans-serif;
            --font-mono: 'Space Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-display);
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        /* Grid pattern background */
        .grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                linear-gradient(var(--accent-cyan) 1px, transparent 1px),
                linear-gradient(90deg, var(--accent-cyan) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.05;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: center top;
        }

        /* Neon glow effects */
        .neon-cyan {
            color: var(--accent-cyan);
            text-shadow:
                0 0 5px var(--accent-cyan),
                0 0 10px var(--accent-cyan),
                0 0 20px rgba(0, 255, 204, 0.5);
        }

        .neon-magenta {
            color: var(--accent-magenta);
            text-shadow:
                0 0 5px var(--accent-magenta),
                0 0 10px var(--accent-magenta),
                0 0 20px rgba(255, 0, 170, 0.5);
        }

        .cyber-border {
            position: relative;
            padding: clamp(2rem, 5vw, 3rem);
            border: 1px solid rgba(0, 255, 204, 0.3);
            background: rgba(10, 15, 28, 0.8);
            backdrop-filter: blur(10px);
            max-width: min(85vw, 800px);
            margin: 0 auto;
        }

        .cyber-border::before,
        .cyber-border::after {
            content: '';
            position: absolute;
            width: clamp(15px, 3vw, 30px);
            height: clamp(15px, 3vw, 30px);
            border-color: var(--accent-cyan);
            border-style: solid;
        }

        .cyber-border::before {
            top: -1px;
            left: -1px;
            border-width: 2px 0 0 2px;
        }

        .cyber-border::after {
            bottom: -1px;
            right: -1px;
            border-width: 0 2px 2px 0;
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        text-shadow 0.8s ease;
        }

        .slide.visible .reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .slide.visible .reveal:nth-child(1) { transition-delay: 0.1s; }
        .slide.visible .reveal:nth-child(2) { transition-delay: 0.3s; }
        .slide.visible .reveal:nth-child(3) { transition-delay: 0.5s; }

        h1 {
            font-size: var(--title-size);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
        }

        .subtitle {
            font-family: var(--font-mono);
            font-size: var(--body-size);
            color: var(--text-secondary);
            margin-top: var(--element-gap);
        }

        .cyber-tag {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: var(--small-size);
            color: var(--accent-cyan);
            border: 1px solid rgba(0, 255, 204, 0.5);
            padding: clamp(4px, 0.5vw, 6px) clamp(12px, 1.5vw, 16px);
            margin-bottom: clamp(1rem, 2vw, 1.5rem);
        }
    </style>
</head>
<body>
    <section class="slide visible">
        <div class="grid-pattern"></div>
        <div class="slide-content" style="align-items: center; text-align: center;">
            <div class="cyber-border reveal">
                <div class="cyber-tag reveal">AI POWERED</div>
                <h1 class="reveal">
                    <span class="neon-cyan">gsearch</span><span class="neon-magenta">-cli</span>
                </h1>
                <p class="subtitle reveal">给 AI Agent 装上谷歌搜索能力</p>
            </div>
        </div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.slide').classList.add('visible');
        });
    </script>
</body>
</html>
