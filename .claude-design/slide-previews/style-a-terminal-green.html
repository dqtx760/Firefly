<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gsearch-cli - Terminal Green Style</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* ===========================================
           VIEWPORT FITTING: MANDATORY BASE STYLES
           =========================================== */
        html, body {
            height: 100%;
            overflow-x: hidden;
        }
        html {
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }
        .slide {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .slide-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-height: 100%;
            overflow: hidden;
            padding: var(--slide-padding);
        }
        :root {
            --title-size: clamp(1.5rem, 5vw, 4rem);
            --h2-size: clamp(1.25rem, 3.5vw, 2.5rem);
            --body-size: clamp(0.75rem, 1.5vw, 1.125rem);
            --slide-padding: clamp(1rem, 4vw, 4rem);
            --content-gap: clamp(0.5rem, 2vw, 2rem);
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.2s !important;
            }
            html { scroll-behavior: auto; }
        }

        /* ===========================================
           TERMINAL GREEN THEME
           Developer-focused, hacker aesthetic
           =========================================== */
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --text-primary: #39d353;
            --text-secondary: #8b949e;
            --accent: #39d353;
            --accent-glow: rgba(57, 211, 83, 0.3);
            --font-mono: 'JetBrains Mono', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-mono);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        /* Scan line effect */
        .slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
            pointer-events: none;
            z-index: 100;
            opacity: 0.3;
        }

        /* Terminal window decoration */
        .terminal-window {
            background: var(--bg-secondary);
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: clamp(1rem, 3vw, 2rem);
            position: relative;
            max-width: min(85vw, 800px);
            margin: 0 auto;
        }

        .terminal-window::before {
            content: '◉ ◉ ◉';
            position: absolute;
            top: clamp(8px, 1vw, 12px);
            left: clamp(12px, 1.5vw, 16px);
            color: #ff5f56;
            font-size: var(--body-size);
            letter-spacing: 4px;
        }

        .terminal-title {
            position: absolute;
            top: clamp(6px, 1vw, 10px);
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: var(--small-size);
        }

        .cursor {
            display: inline-block;
            width: 0.6em;
            height: 1.2em;
            background: var(--accent);
            animation: blink 1s step-end infinite;
            vertical-align: text-bottom;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1),
                        transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide.visible .reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .slide.visible .reveal:nth-child(1) { transition-delay: 0.1s; }
        .slide.visible .reveal:nth-child(2) { transition-delay: 0.3s; }

        h1 {
            font-size: var(--title-size);
            font-weight: 700;
            text-shadow: 0 0 20px var(--accent-glow);
            margin-bottom: var(--content-gap);
        }

        .subtitle {
            font-size: var(--body-size);
            color: var(--text-secondary);
        }

        .prompt {
            color: var(--text-secondary);
        }

        .glow-text {
            text-shadow: 0 0 10px var(--accent-glow), 0 0 20px var(--accent-glow);
        }
    </style>
</head>
<body>
    <section class="slide visible">
        <div class="slide-content" style="align-items: center; text-align: center;">
            <div class="terminal-window reveal">
                <div class="terminal-title">terminal</div>
                <div style="margin-top: clamp(1.5rem, 3vw, 2.5rem);">
                    <p class="prompt reveal" style="margin-bottom: clamp(0.5rem, 1vw, 1rem);">
                        $ gsearch --help
                    </p>
                    <h1 class="reveal glow-text">gsearch-cli</h1>
                    <p class="subtitle reveal" style="margin-top: var(--element-gap);">
                        给 AI Agent 装上谷歌搜索能力<span class="cursor"></span>
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Simple preview animation trigger
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.slide').classList.add('visible');
        });
    </script>
</body>
</html>
